apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: share-radio-web
  namespace: share-radio
spec:
  entryPoints:
    - web                # HTTP → nodePort 31277 on the Pi
  routes:
    - match: PathPrefix(`/radio`)
      kind: Rule
      priority: 100
      middlewares:
        - name: share-radio-slash
        - name: share-radio-strip
      services:
        - name: share-radio-web
          port: 80